{% extends 'base.html' %}

{% block content %}

<div class="diary-card">

    <h1>
        {{ entry.title }}
    </h1>

    <h3>
        Mood:
        {{ entry.mood }}
    </h3>

    <p>
        {{ entry.content }}
    </p>

    <p>
        Created:
        {{ entry.created_date }}
    </p>

    <p>
        Updated:
        {{ entry.updated_date }}
    </p>

    <a href="{% url 'edit_entry' entry.pk %}"
       class="btn">

        Edit

    </a>

    <a href="{% url 'delete_entry' entry.pk %}"
       class="btn">

        Delete

    </a>

</div>

{% endblock %}
